version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dating_bot_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: dating_bot
      MYSQL_USER: bot_user
      MYSQL_PASSWORD: bot_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dating_bot_network
    restart: unless-stopped

  bot:
    build: .
    container_name: dating_bot_app
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=bot_user:bot_password@tcp(mysql:3306)/dating_bot?charset=utf8mb4&parseTime=True&loc=Local
    depends_on:
      - mysql
    networks:
      - dating_bot_network
    restart: unless-stopped
    volumes:
      - ./photos:/app/photos

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dating_bot_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: password
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - dating_bot_network

volumes:
  mysql_data:

networks:
  dating_bot_network:
    driver: bridge